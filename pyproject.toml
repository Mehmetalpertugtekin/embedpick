[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "embedpick"
version = "0.2.0"
description = "Benchmark embedding models on your own data, with a keyword-search baseline"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mehmet Alper Tugtekin" }]
keywords = [
    "embeddings",
    "benchmark",
    "semantic-search",
    "information-retrieval",
    "sentence-transformers",
    "turkish-nlp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
    "Natural Language :: Turkish",
    "Natural Language :: English",
]
dependencies = [
    "pandas>=1.3",
    "numpy>=1.21",
    "rank-bm25>=0.2",
    "sentence-transformers>=2.2",
    "faiss-cpu>=1.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "faiss-cpu>=1.7"]
ui = ["gradio>=4.0"]
# Zemberek JVM üzerinde çalışır ve Java kurulu olmasını gerektirir;
# --stemmer zemberek dışında hiçbir yerde kullanılmıyor, o yüzden ayrı.
zemberek = ["zemberek-python>=0.2"]

[project.urls]
Homepage = "https://github.com/Mehmetalpertugtekin/embedpick"
Repository = "https://github.com/Mehmetalpertugtekin/embedpick"
Issues = "https://github.com/Mehmetalpertugtekin/embedpick/issues"

[project.scripts]
embedpick = "embedpick.cli:main"

[tool.ruff]
# Kural kümesi açıkça yazılı: ruff'ın varsayılanı sürümle birlikte değişiyor
# ve CI'ın bir gün kendiliğinden kırmızıya dönmesini istemiyoruz.
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # import sıralaması
    "UP",  # eski Python kalıpları
    "B",   # bugbear: sessiz hata kaynakları
]

[tool.ruff.lint.per-file-ignores]
# app.py'de import sırası bilinçli: ZeroGPU'da `spaces` paketi torch'tan
# ÖNCE import edilmek zorunda, o yüzden dosyanın başında bir try/except ve
# GPU süresi sabiti duruyor. E402 bunu "geç import" sanıyor.
"app.py" = ["E402"]

[tool.setuptools.packages.find]
include = ["embedpick*"]

[tool.setuptools.package-data]
embedpick = ["sample_data/*.csv"]
